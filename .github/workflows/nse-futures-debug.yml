name: Debug NSE futures candles

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: futures-collector
      - run: cargo run --release --manifest-path futures-collector/Cargo.toml -- --debug
