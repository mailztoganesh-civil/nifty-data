name: Collect NIFTY futures (NSE, free)

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 16:10 IST, after market close, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: futures-collector

      - name: Collect futures data
        run: cargo run --release --manifest-path futures-collector/Cargo.toml -- --daily

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/futures_live || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "futures: $(date -u +%F)"
          git pull --rebase
          git push
