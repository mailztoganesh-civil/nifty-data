name: Import Nifty futures (Zenodo 2017-2020)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas requests openpyxl xlrd

      - name: Download and convert
        run: python scripts/zenodo_futures.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/futures
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add Nifty futures 1-min data 2017-2020 (Zenodo)"
          git push
